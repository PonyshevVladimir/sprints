<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Panto - furniture store</title>

        <link rel="stylesheet" href="./assets/styles/main.css"/>
    </head>

    <body>
        <div class="intro-wrapper">

            <header class="header">
                <div class="container">
                    <nav class="header__nav">
                        <a href="" class="header__link header__logo">Panto</a>

                        <div class="header__box-link">
                            <a href="#" class="header__link">About Us</a>
                            <a href="#" class="header__link">Best products</a>
                            <a href="#" class="header__link">Reviews</a>
                        </div>

                        <button class="header__carter-toggle">
                            <img src="./assets/icons/bag.svg" alt="">
                        </button>
                    </nav>
                </div>
            </header>

            <section class="hero">
                <div class="container">
                    <h2 class="hero__title">
                        Make your interior more
                        minimalistic & modern
                    </h2>

                    <p class="hero__caption">
                        Turn your room with panto into a lot more minimalist
                        and modern with ease and speed
                    </p>

                    <form action="" class="hero__search-form">
                        <input class="hero__search-input" type="text" placeholder="Search furniture">
                        <button class="hero__search-button">
                            <img src="./assets/icons/search.svg" alt="" class="hero__search-img">
                        </button>
                    </form>
                </div>
            </section>
        </div>




    </body>
</html>
